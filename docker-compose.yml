services:
  web:
    build: .
    ports:
      - "${BIND_ADDRESS}:9000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./config/database.docker.yml:/app/config/database.yml:Z
      - ./app/assets:/app/app/assets:Z
      - ./app/views:/app/app/views:Z
      - ./public/system:/app/public/system:Z
    environment:
      - RAILS_ENV=${RAILS_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
        if [ \"$$RESET_DB\" = '1' ]; then
          mv spec/factories /tmp/_factories 2>/dev/null;
          bundle exec rake db:schema:load db:seed 2>/dev/null;
          mv /tmp/_factories spec/factories 2>/dev/null;
        fi;
        if [ \"$$RAILS_ENV\" = 'production' ]; then
          bundle exec rake assets:precompile 2>/dev/null;
        fi;
        bundle exec rails server -b 0.0.0.0 -p 3000
      "

  db:
    image: mysql:5.5
    command: mysqld --character-set-server=utf8 --collation-server=utf8_czech_ci
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./dump:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
